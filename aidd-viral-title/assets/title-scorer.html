<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标题评分器 — AIDD爆款标题工具箱</title>
<style>
  * { margin:0; padding:0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f0f4f8; color: #1a1a1a; line-height: 1.6;
  }
  .container { max-width: 720px; margin: 0 auto; padding: 20px 16px; }
  header { text-align: center; padding: 24px 0 16px; }
  header h1 { font-size: 22px; color: #028090; margin-bottom: 6px; }
  header p { color: #666; font-size: 13px; }

  .score-box {
    background: #fff; border-radius: 14px; padding: 28px 24px; margin: 16px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .score-box h2 { font-size: 15px; color: #333; margin-bottom: 16px; }

  textarea {
    width: 100%; padding: 14px; border: 1.5px solid #ddd; border-radius: 10px;
    font-size: 15px; font-family: inherit; resize: vertical; min-height: 70px;
    transition: border-color 0.2s;
  }
  textarea:focus { outline: none; border-color: #028090; }

  .btn-row { display: flex; gap: 10px; margin-top: 14px; }
  button {
    flex: 1; padding: 12px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s;
  }
  .btn-primary { background: #028090; color: #fff; }
  .btn-primary:hover { background: #026d7a; }
  .btn-secondary { background: #e8f4f8; color: #028090; }
  .btn-secondary:hover { background: #d0e8f0; }

  .score-display { display: none; margin-top: 20px; }
  .score-display.show { display: block; }
  .score-circle-wrap { display: flex; align-items: center; gap: 20px; margin-bottom: 16px; }
  .score-circle {
    width: 90px; height: 90px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; flex-direction: column;
    font-size: 32px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .score-label { font-size: 12px; font-weight: 400; opacity: 0.85; }
  .score-text { font-size: 14px; color: #333; line-height: 1.5; }
  .score-grade { font-size: 13px; font-weight: 600; margin-top: 4px; }

  .dim-grid { display: grid; gap: 10px; margin-top: 16px; }
  .dim-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    background: #f8fafc; border-radius: 8px; font-size: 13px;
  }
  .dim-name { width: 100px; color: #555; flex-shrink: 0; }
  .dim-bar-wrap { flex: 1; height: 8px; background: #e8ecf0; border-radius: 4px; overflow: hidden; }
  .dim-bar { height: 100%; border-radius: 4px; transition: width 0.5s; }
  .dim-score { width: 40px; text-align: right; font-weight: 600; color: #333; flex-shrink: 0; }

  .suggestions { margin-top: 16px; }
  .suggestions h3 { font-size: 14px; color: #028090; margin-bottom: 8px; }
  .sugg-item {
    padding: 10px 14px; background: #f0faf6; border-radius: 8px; margin: 6px 0;
    font-size: 13px; color: #333; border-left: 3px solid #028090;
  }
  .sugg-item .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-right: 6px; color: #fff; }

  .formula-match { margin-top: 16px; }
  .formula-match h3 { font-size: 14px; color: #333; margin-bottom: 8px; }
  .formula-tag {
    display: inline-block; padding: 5px 12px; border-radius: 16px; font-size: 12px;
    margin: 4px 6px 4px 0; font-weight: 500;
  }

  .history { margin-top: 20px; }
  .history h3 { font-size: 14px; color: #555; margin-bottom: 8px; }
  .history-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: #fff; border-radius: 8px; margin: 4px 0; font-size: 13px;
    border: 1px solid #eee;
  }
  .history-score { font-weight: 700; font-size: 16px; width: 36px; text-align: center; flex-shrink: 0; }
  .history-title { flex: 1; color: #333; }
  .history-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 0 4px; flex: unset; }
  .history-del:hover { color: #e74c3c; }

  .footer { text-align: center; padding: 24px 0 12px; color: #aaa; font-size: 11px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>爆款标题评分器</h1>
    <p>输入标题，即刻获得评分 + 改进建议 + 匹配公式</p>
  </header>

  <div class="score-box">
    <h2>输入你的标题</h2>
    <textarea id="titleInput" placeholder="例如：英矽智能 ISM001-055 IIa期数据公布，FVC改善98.4mL"></textarea>
    <div class="btn-row">
      <button class="btn-primary" onclick="scoreTitle()">评分分析</button>
      <button class="btn-secondary" onclick="clearAll()">清空</button>
    </div>

    <div class="score-display" id="scoreDisplay">
      <div class="score-circle-wrap">
        <div class="score-circle" id="scoreCircle">
          <span id="scoreNum">0</span>
          <span class="score-label">/ 100</span>
        </div>
        <div>
          <div class="score-text" id="scoreText"></div>
          <div class="score-grade" id="scoreGrade"></div>
        </div>
      </div>

      <div class="dim-grid" id="dimGrid"></div>

      <div class="suggestions" id="suggestions"></div>

      <div class="formula-match" id="formulaMatch"></div>
    </div>
  </div>

  <div class="score-box history">
    <h3>评分历史</h3>
    <div id="historyList"><p style="color:#aaa;font-size:13px;">暂无历史记录</p></div>
  </div>

  <div class="footer">生物医药 / AI制药 爆款标题方法论 | AIDD Viral Title Skill</div>
</div>

<script>
const FORMULAS = [
  { name: "管线里程碑式", keywords: ["临床","II期","III期","获批","数据","终点","FVC","NDA","FDA","NMPA","上市","批准"], score: 0 },
  { name: "不可成药突破式", keywords: ["不可成药","首次","突破","靶点","KRAS","MYC"], score: 0 },
  { name: "方法学对比式", keywords: ["对比","vs","vs.","传统","AI方法","筛了","锁定","头对头"], score: 0 },
  { name: "大厂实践深挖式", keywords: ["内部","报告","诺华","辉瑞","赛诺菲","扒了","揭秘","独家"], score: 0 },
  { name: "学术到工业鸿沟式", keywords: ["论文","落地","SOTA","沉默了","CRO","QSAR","合成","生成"], score: 0 },
  { name: "反直觉发现式", keywords: ["？","为什么","但","其实","原来","颠覆","LogP","代谢"], score: 0 },
  { name: "交易与格局变化式", keywords: ["融资","合作","交易","收购","退出","钱","美元","信号"], score: 0 },
  { name: "个人亲历式", keywords: ["我","面试了","踩过","年","发现","经历"], score: 0 },
];

const HIGH_CLICK_WORDS = [
  "刚刚","首次","沉默了","真相","揭秘","突破","不可成药","落地了吗",
  "合成得了吗","临床验证","湿实验","头对头","回顾性","真实世界",
  "领先多少","对手在用","窗口期","内部报告","IPO","协议","信号",
  "我以为","其实","原来","为什么","吗","？"
];

const DANGER_WORDS = ["震惊","颠覆","革命","神药","治愈","全世界","看傻了","吓尿","恐怖"];

const TABOO_WORDS = ["AI颠覆药物研发","AI设计的药物","震惊","全世界都看傻了"];

function scoreTitle() {
  const title = document.getElementById('titleInput').value.trim();
  if (!title) { alert('请输入标题'); return; }

  let score = 0;
  let dims = [];
  let suggestions = [];
  let matchedFormulas = [];

  // 1. 长度检查 (25分)
  let lenScore = 0;
  if (title.length <= 20) lenScore = 25;
  else if (title.length <= 25) lenScore = 20;
  else if (title.length <= 30) lenScore = 12;
  else lenScore = 5;
  dims.push({ name: "长度控制", score: lenScore, max: 25, barColor: "#028090" });
  if (title.length > 25) suggestions.push({ tag: "长度", tagColor: "#e74c3c", text: `当前 ${title.length} 字，超过 25 字会被截断。精简到 25 字以内，核心钩子放前 15 字。` });

  // 2. 数字检查 (20分)
  let hasNum = /\d/.test(title);
  let numCount = (title.match(/\d+/g) || []).length;
  let numScore = hasNum ? Math.min(numCount * 10, 20) : 0;
  dims.push({ name: "具体数字", score: numScore, max: 20, barColor: "#1D9E75" });
  if (!hasNum) suggestions.push({ tag: "数字", tagColor: "#e67e22", text: `标题缺少具体数字。加入临床阶段、样本量、百分比等数字可提升 20 分可信度。例如："50% 达到终点"。` });

  // 3. 情绪/悬念词检查 (20分)
  let hcCount = HIGH_CLICK_WORDS.filter(w => title.includes(w)).length;
  let emotionScore = Math.min(hcCount * 5, 20);
  dims.push({ name: "情绪/悬念词", score: emotionScore, max: 20, barColor: "#D85A30" });
  if (hcCount === 0) suggestions.push({ tag: "情绪词", tagColor: "#9b59b6", text: `标题缺少情绪触发词。可加入"刚刚""首次""沉默了""真相"等词制造点击动机。` });

  // 4. 问号/信息缺口 (15分)
  let hasQ = title.includes('？') || title.includes('?');
  let gapScore = hasQ ? 15 : 0;
  dims.push({ name: "信息缺口(问号)", score: gapScore, max: 15, barColor: "#7F77DD" });
  if (!hasQ) suggestions.push({ tag: "信息缺口", tagColor: "#3498db", text: `标题是陈述句，无信息缺口。尝试改成问句，如"……吗？""为什么……？"可显著提升点击率。` });

  // 5. 领域术语准确度 (10分)
  let hasTerm = /AI|临床|靶点|分子|管线|PD-1|小分子|ADMET|FVC|IPF|HTS|DiffDock|AlphaFold|CADD|AIDD/.test(title);
  let termScore = hasTerm ? 10 : 5;
  dims.push({ name: "领域术语", score: termScore, max: 10, barColor: "#BA7517" });

  // 6. 标题党检查 (扣分项)
  let dangerCount = DANGER_WORDS.filter(w => title.includes(w)).length;
  let tabooCount = TABOO_WORDS.filter(w => title.includes(w)).length;
  let penalty = dangerCount * 10 + tabooCount * 20;
  if (dangerCount > 0) suggestions.push({ tag: "⚠️ 标题党", tagColor: "#e74c3c", text: `检测到"${DANGER_WORDS.filter(w => title.includes(w)).join('、')}"等高危词，可能触发微信算法折叠，降低账号权重。建议替换为客观描述。` });
  if (tabooCount > 0) suggestions.push({ tag: "🚫 绝对禁区", tagColor: "#c0392b", text: `标题包含严重违规表述，请立即修改！` });

  // 计算总分
  score = dims.reduce((a, d) => a + d.score, 0) - penalty;
  score = Math.max(0, Math.min(100, score));

  // 匹配公式
  let formulaScores = FORMULAS.map(f => {
    let s = f.keywords.filter(k => title.includes(k)).length;
    return { name: f.name, match: s };
  }).filter(f => f.match > 0).sort((a,b) => b.match - a.match);
  matchedFormulas = formulaScores;

  if (formulaScores.length === 0) {
    suggestions.push({ tag: "公式匹配", tagColor: "#7F77DD", text: `标题未匹配任何爆款公式。尝试套用"管线里程碑式"或"反直觉发现式"模板重新组织语言。` });
  }

  // 前15字钩子检查
  let first15 = title.substring(0, 15);
  let hasHookIn15 = HIGH_CLICK_WORDS.some(w => first15.includes(w)) || /[\d？?]/.test(first15);
  if (!hasHookIn15) {
    suggestions.push({ tag: "前15字", tagColor: "#e67e22", text: `推送列表只显示前 15-18 字，当前前半段缺少钩子。请将核心数字或悬念词移到标题开头。` });
  }

  // 渲染
  renderScore(score, dims, suggestions, matchedFormulas);
  saveHistory(title, score);
}

function renderScore(score, dims, suggestions, formulas) {
  const display = document.getElementById('scoreDisplay');
  display.classList.add('show');

  const circle = document.getElementById('scoreCircle');
  let color;
  let text, grade;
  if (score >= 80) { color = "#1D9E75"; text = "优质标题！信息密度高，点击动机强，可直接发布。"; grade = "⭐⭐⭐⭐⭐ 优秀"; }
  else if (score >= 60) { color = "#028090"; text = "良好标题，但还有提升空间。参考下方建议进行优化。"; grade = "⭐⭐⭐⭐ 良好"; }
  else if (score >= 40) { color = "#BA7517"; text = "标题偏平淡，点击率可能不理想。建议大幅修改。"; grade = "⭐⭐⭐ 一般"; }
  else { color = "#D85A30"; text = "标题存在明显问题，建议重新构思。参考8大公式模板。"; grade = "⭐⭐ 较差"; }

  circle.style.background = `linear-gradient(135deg, ${color}, ${color}dd)`;
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreText').textContent = text;
  document.getElementById('scoreGrade').textContent = grade;
  document.getElementById('scoreGrade').style.color = color;

  const grid = document.getElementById('dimGrid');
  grid.innerHTML = dims.map(d => `
    <div class="dim-item">
      <span class="dim-name">${d.name}</span>
      <div class="dim-bar-wrap"><div class="dim-bar" style="width:${d.score/d.max*100}%;background:${d.barColor}"></div></div>
      <span class="dim-score">${d.score}/${d.max}</span>
    </div>
  `).join('');

  const suggBox = document.getElementById('suggestions');
  if (suggestions.length > 0) {
    suggBox.innerHTML = `<h3>💡 改进建议</h3>` + suggestions.map(s => `
      <div class="sugg-item">
        <span class="tag" style="background:${s.tagColor}">${s.tag}</span>
        ${s.text}
      </div>
    `).join('');
    suggBox.style.display = 'block';
  } else {
    suggBox.innerHTML = `<h3>💡 改进建议</h3><div class="sugg-item"><span class="tag" style="background:#1D9E75">✅ 完美</span>暂无改进建议，标题质量优秀！</div>`;
    suggBox.style.display = 'block';
  }

  const fm = document.getElementById('formulaMatch');
  if (formulas.length > 0) {
    fm.innerHTML = `<h3>📐 匹配公式</h3>` + formulas.map(f => `
      <span class="formula-tag" style="background:#EEEDFE;color:#534AB7;border:1px solid #AFA9EC">${f.name}（匹配${f.match}个关键词）</span>
    `).join('');
    fm.style.display = 'block';
  } else {
    fm.innerHTML = `<h3>📐 匹配公式</h3><span class="formula-tag" style="background:#F1EFE8;color:#888">未匹配任何公式</span>`;
    fm.style.display = 'block';
  }
}

function saveHistory(title, score) {
  let history = JSON.parse(localStorage.getItem('titleHistory') || '[]');
  history.unshift({ title, score, time: new Date().toLocaleTimeString() });
  if (history.length > 10) history = history.slice(0, 10);
  localStorage.setItem('titleHistory', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  let history = JSON.parse(localStorage.getItem('titleHistory') || '[]');
  const list = document.getElementById('historyList');
  if (history.length === 0) {
    list.innerHTML = '<p style="color:#aaa;font-size:13px;">暂无历史记录</p>';
    return;
  }
  list.innerHTML = history.map((h, i) => {
    let color = h.score >= 80 ? '#1D9E75' : h.score >= 60 ? '#028090' : h.score >= 40 ? '#BA7517' : '#D85A30';
    return `
      <div class="history-item">
        <span class="history-score" style="color:${color}">${h.score}</span>
        <span class="history-title">${h.title}</span>
        <button class="history-del" onclick="deleteHistory(${i})" title="删除">×</button>
      </div>
    `;
  }).join('');
}

function deleteHistory(idx) {
  let history = JSON.parse(localStorage.getItem('titleHistory') || '[]');
  history.splice(idx, 1);
  localStorage.setItem('titleHistory', JSON.stringify(history));
  renderHistory();
}

function clearAll() {
  document.getElementById('titleInput').value = '';
  document.getElementById('scoreDisplay').classList.remove('show');
}

renderHistory();
</script>
</body>
</html>
